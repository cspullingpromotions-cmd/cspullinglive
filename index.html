<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CS Pull Live — Live Results</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=Barlow:wght@400;500;600;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{--red:#c0392b;--red2:#a93226;--gold:#f0c030;--gold2:#d4a800;--bg:#0a0a0a;--bg2:#131313;--bg3:#1a1a1a;--bg4:#222;--border:#2a2a2a;--border2:#333;--text:#fff;--text2:#bbb;--text3:#888;--text4:#555;--green:#1db954;--blue:#3a8fd4;}
body{font-family:'Barlow',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:16px}
.header{background:linear-gradient(135deg,#0a0a0a 0%,#1a0505 50%,#0a0a0a 100%);border-bottom:3px solid var(--red);padding:0 20px;display:flex;align-items:stretch;justify-content:space-between;min-height:68px}
.header-left{display:flex;align-items:center;gap:16px}
.logo-block{display:flex;flex-direction:column;justify-content:center;padding:10px 0}
.logo-top{font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;letter-spacing:4px;color:var(--text4);text-transform:uppercase}
.logo-main{font-family:'Barlow Condensed',sans-serif;font-size:32px;font-weight:900;letter-spacing:2px;line-height:1}
.logo-main span{color:var(--red)}
.logo-sub{font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:600;letter-spacing:3px;color:var(--gold);text-transform:uppercase;margin-top:2px}
.header-divider{width:2px;background:var(--border2);margin:10px 0;flex-shrink:0}
.header-event{display:flex;flex-direction:column;justify-content:center;padding:10px 0}
.event-label{font-size:11px;font-weight:700;letter-spacing:2px;color:var(--text4);text-transform:uppercase}
.event-name{font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:700;color:var(--text2);margin-top:1px}
.header-right{display:flex;align-items:center;gap:10px}
.status-pill{display:flex;align-items:center;gap:6px;background:var(--bg3);border:1px solid var(--border2);border-radius:20px;padding:6px 14px;font-size:12px;font-weight:700;letter-spacing:1px;font-family:'Barlow Condensed',sans-serif}
.dot{width:9px;height:9px;border-radius:50%;background:var(--green);animation:pulse 2s infinite}
.dot.offline{background:var(--red);animation:none}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.admin-link{font-family:'Barlow Condensed',sans-serif;font-size:12px;color:var(--text4);text-decoration:none;letter-spacing:1px;text-transform:uppercase;padding:6px 12px;border:1px solid var(--border);border-radius:4px;transition:all .15s}
.admin-link:hover{color:var(--text2);border-color:var(--border2)}
.tabs{display:flex;background:var(--bg2);border-bottom:1px solid var(--border);overflow-x:auto}
.tab{padding:16px 20px;font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;letter-spacing:1.5px;cursor:pointer;color:var(--text4);border-bottom:3px solid transparent;white-space:nowrap;flex-shrink:0;text-transform:uppercase;transition:all .15s}
.tab.active{color:var(--text);border-bottom-color:var(--red)}
.tab:hover:not(.active){color:var(--text2);background:rgba(255,255,255,.03)}
.view{display:none}.view.active{display:block}
.sec{font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;color:var(--red);text-transform:uppercase;letter-spacing:2px;margin-bottom:10px}
.sec-line{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.sec-line .sec{margin-bottom:0}
.sec-line::after{content:'';flex:1;height:1px;background:var(--border)}
.card{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:16px;margin-bottom:12px}
.card-dark{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:16px;margin-bottom:12px}
.class-bar{background:var(--bg2);border-bottom:1px solid var(--border);padding:12px 20px;overflow-x:auto;white-space:nowrap;display:flex;gap:8px;align-items:center}
.class-chip{display:inline-flex;align-items:center;gap:6px;background:var(--bg3);border:1px solid var(--border2);border-radius:4px;padding:8px 16px;font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;letter-spacing:1px;text-transform:uppercase;cursor:pointer;white-space:nowrap;transition:all .15s;color:var(--text3)}
.class-chip.selected{background:var(--red);border-color:var(--red);color:#fff}
.class-chip:hover:not(.selected){background:var(--bg4);color:var(--text)}
.leader-card{background:linear-gradient(135deg,#1a0a00 0%,#0f0f0f 100%);border:1px solid var(--border2);border-left:4px solid var(--gold);border-radius:8px;padding:20px 24px;margin-bottom:18px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.leader-label{font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;letter-spacing:3px;color:var(--gold2);text-transform:uppercase;margin-bottom:4px}
.leader-name{font-family:'Barlow Condensed',sans-serif;font-size:40px;font-weight:900;color:var(--gold);line-height:1;letter-spacing:1px}
.leader-vehicle{font-size:14px;color:var(--text3);margin-top:5px}
.leader-dist{font-family:'Barlow Condensed',sans-serif;font-size:52px;font-weight:900;color:var(--red);line-height:1;text-align:right}
.leader-dist-lbl{font-size:12px;color:var(--text3);text-align:right;letter-spacing:1px;font-weight:700;text-transform:uppercase}
.full-pull-badge{background:var(--green);color:#fff;font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;padding:4px 10px;border-radius:3px;display:inline-block;margin-top:5px}
.results-table{width:100%;border-collapse:collapse}
.results-table th{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;color:var(--text4);text-transform:uppercase;letter-spacing:1px;padding:8px 12px;border-bottom:2px solid var(--border2);text-align:left;background:var(--bg2)}
.results-table td{padding:12px 12px;border-bottom:1px solid var(--border);vertical-align:middle;font-size:14px}
.results-table tr.top-row td{background:rgba(240,192,48,.04)}
.results-table tr:hover td{background:rgba(255,255,255,.02)}
.dist-val{font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:700;color:var(--red)}
.result-tag{font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;padding:3px 8px;border-radius:3px;letter-spacing:.5px;text-transform:uppercase}
.tag-full{background:var(--green);color:#fff}.tag-dq{background:var(--red);color:#fff}.tag-broke{background:#5a3a00;color:#f0b040}
.status-badge{font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;padding:4px 10px;border-radius:3px;letter-spacing:1px;text-transform:uppercase}
.s-pending{background:#2a2000;color:#d4a000;border:1px solid #4a3800}
.s-active{background:#0a2a0a;color:var(--green);border:1px solid #1a5a1a}
.s-completed{background:#0a1a2a;color:var(--blue);border:1px solid #1a3a5a}
.rank-badge{width:28px;height:28px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;font-family:'Barlow Condensed',sans-serif}
.r1{background:var(--gold);color:#000}.r2{background:#a8a8a8;color:#000}.r3{background:#a0522d;color:#fff}.rn{background:var(--bg4);color:var(--text3)}
.class-group-hdr{font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:800;color:var(--red);text-transform:uppercase;letter-spacing:2px;padding:10px 0 6px;border-bottom:2px solid var(--border2);margin-bottom:10px}
.event-card{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:16px;margin-bottom:10px;cursor:pointer;transition:all .15s}
.event-card:hover{border-color:var(--border2);background:var(--bg4)}
.event-card.active-event{border-color:var(--red);border-left:3px solid var(--red)}
/* HERO */
.hero{background:linear-gradient(160deg,#1a0000 0%,#0a0a0a 60%);border-bottom:2px solid var(--border);padding:40px 24px 32px;text-align:center;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;top:0;left:0;right:0;bottom:0;background:repeating-linear-gradient(45deg,transparent,transparent 40px,rgba(192,57,43,.03) 40px,rgba(192,57,43,.03) 80px)}
.hero-eyebrow{font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;letter-spacing:4px;color:var(--text4);text-transform:uppercase;margin-bottom:8px}
.hero-title{font-family:'Barlow Condensed',sans-serif;font-size:52px;font-weight:900;letter-spacing:2px;line-height:1;margin-bottom:6px}
.hero-title span{color:var(--red)}
.hero-sub{font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:600;letter-spacing:3px;color:var(--gold);text-transform:uppercase;margin-bottom:20px}
/* STATS BAR */
.stats-bar{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:1px;background:var(--border);border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
.stat-cell{background:var(--bg2);padding:14px 10px;text-align:center}
.stat-val{font-family:'Barlow Condensed',sans-serif;font-size:28px;font-weight:900;color:var(--red);line-height:1}
.stat-lbl{font-size:11px;color:var(--text4);text-transform:uppercase;letter-spacing:1px;margin-top:3px;font-weight:700}
/* COUNTDOWN */
.countdown-box{background:linear-gradient(135deg,#1a0a00,#0f0f0f);border:1px solid var(--border2);border-left:4px solid var(--red);border-radius:8px;padding:16px 20px;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
.countdown-num{font-family:'Barlow Condensed',sans-serif;font-size:36px;font-weight:900;color:var(--red);line-height:1}
.countdown-lbl{font-size:11px;color:var(--text4);text-transform:uppercase;letter-spacing:1px;font-weight:700}
.countdown-unit{text-align:center;min-width:54px}
/* SCROLLER */
.scroller-wrap{overflow:hidden;position:relative;margin-bottom:20px}
.scroller-inner{display:flex;gap:14px;animation:scroll-x 35s linear infinite}
.scroller-inner:hover{animation-play-state:paused}
.scroller-card{flex-shrink:0;width:240px;background:var(--bg3);border:1px solid var(--border2);border-radius:8px;padding:14px}
@keyframes scroll-x{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
/* FOOTER */
footer{background:var(--bg2);border-top:2px solid var(--border);padding:32px 24px;margin-top:40px}
.footer-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:24px;max-width:900px;margin:0 auto}
.footer-logo{font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:900;letter-spacing:1px;margin-bottom:6px}
.footer-logo span{color:var(--red)}
.footer-tagline{font-size:12px;color:var(--text4);letter-spacing:1px}
.footer-heading{font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;color:var(--red);text-transform:uppercase;letter-spacing:2px;margin-bottom:10px}
.footer-link{display:block;font-size:14px;color:var(--text3);text-decoration:none;margin-bottom:6px;transition:color .15s}
.footer-link:hover{color:var(--text)}
.footer-bottom{text-align:center;font-size:12px;color:var(--text4);margin-top:24px;padding-top:16px;border-top:1px solid var(--border)}
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <div class="logo-block">
      <div class="logo-top">Official Scoring</div>
      <div class="logo-main">CS PULLING <span>PROMOTIONS</span></div>
      <div class="logo-sub">Live Results &amp; Scoring</div>
    </div>
    <div class="header-divider"></div>
    <div class="header-event">
      <div class="event-label">Active Event</div>
      <div class="event-name" id="headerEvent">Loading...</div>
    </div>
  </div>
  <div class="header-right">
    <div class="status-pill"><span class="dot" id="statusDot"></span><span id="statusText">CONNECTING</span></div>
    <a href="admin.html" class="admin-link">Staff</a>
  </div>
</div>

<div class="tabs">
  <div class="tab active" onclick="switchTab('home')">Home</div>
  <div class="tab" onclick="switchTab('results')">Live Results</div>
  <div class="tab" onclick="switchTab('points')">Points</div>
  <div class="tab" onclick="switchTab('schedule')">Schedule</div>
</div>

<!-- HOME -->
<div class="view active" id="tab-home">
  <div id="homeContent"><div style="text-align:center;padding:60px;color:var(--text4)">Connecting...</div></div>
</div>

<!-- LIVE RESULTS -->
<div class="view" id="tab-results">
  <div class="class-bar" id="viewerClassBar"><span style="font-size:13px;color:var(--text4);font-family:'Barlow Condensed',sans-serif;letter-spacing:1px;text-transform:uppercase">Connecting...</span></div>
  <div style="padding:20px" id="viewerContent"></div>
</div>

<!-- POINTS -->
<div class="view" id="tab-points" style="padding:20px">
  <div class="sec-line"><div class="sec">Season Points Standings</div></div>
  <div id="pointsContent"></div>
</div>

<!-- SCHEDULE -->
<div class="view" id="tab-schedule" style="padding:20px">
  <div class="sec-line"><div class="sec">Event Schedule</div></div>
  <div id="scheduleContent"></div>
  <div id="eventDetailPanel" style="display:none;margin-top:16px"></div>
</div>

<footer id="siteFooter" style="display:none">
  <div class="footer-grid">
    <div>
      <div class="footer-logo">CS PULLING <span>PROMOTIONS</span></div>
      <div class="footer-tagline">Official Scoring &amp; Results</div>
    </div>
    <div id="footerContact"></div>
    <div id="footerSocial"></div>
    <div id="footerAddress"></div>
  </div>
  <div class="footer-bottom">© <span id="footerYear"></span> CS Pulling Promotions. All rights reserved.</div>
</footer>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script>
firebase.initializeApp({apiKey:"AIzaSyDsoRFT_H07cODylZsD8HsSKJAcZIJOhlY",authDomain:"cs-pulling-live.firebaseapp.com",databaseURL:"https://cs-pulling-live-default-rtdb.firebaseio.com",projectId:"cs-pulling-live",storageBucket:"cs-pulling-live.firebasestorage.app",messagingSenderId:"266460064990",appId:"1:266460064990:web:fbb91d5b007e312ee4264f"});
const db=firebase.database();
let state={events:[],activeEventId:null,members:[],classes:[],manualPoints:{},contact:{}};
let viewerActiveClass=null,selectedScheduleEvent=null;

document.getElementById('footerYear').textContent=new Date().getFullYear();

function switchTab(t){
  ['home','results','points','schedule'].forEach((n,i)=>{
    document.querySelectorAll('.tab')[i].classList.toggle('active',n===t);
    document.getElementById('tab-'+n).classList.toggle('active',n===t);
  });
  if(t==='home')renderHome();
  if(t==='results')renderViewer();
  if(t==='points')renderPoints();
  if(t==='schedule')renderSchedule();
}

function getActiveEvent(){return state.events.find(e=>e.id===state.activeEventId)||null;}

function getRankedPulls(cls){
  return[...cls.competitors].map(comp=>{
    const pull=(cls.pulls||[]).find(p=>p.compId===comp.id);
    const valid=pull&&pull.result&&pull.result!=='dq'&&pull.result!=='broke';
    return{comp,pull,distNum:valid?(pull.distNum||0):0,valid};
  }).sort((a,b)=>{if(a.valid&&!b.valid)return -1;if(!a.valid&&b.valid)return 1;return b.distNum-a.distNum;});
}

function getPosByPosition(pos){if(pos===1)return 50;if(pos===2)return 48;if(pos===3)return 46;const p=50-((pos-1)*2);return p>=26?p:24;}
function getCalcPoints(cls,compId){
  const comp=cls.competitors.find(c=>c.id===compId);
  if(comp&&comp.pointsCompetitor===false)return 0;
  const ranked=getRankedPulls(cls).filter(r=>r.comp.pointsCompetitor!==false);
  const idx=ranked.findIndex(r=>r.comp.id===compId&&r.valid);
  if(idx<0)return 0;
  const pull=(cls.pulls||[]).find(p=>p.compId===compId);
  if(!pull||!pull.result||pull.result==='dq')return 0;
  return getPosByPosition(idx+1);
}
function mpKey(evId,clsId,compId){return `${evId}_${clsId}_${compId}`;}
function getPoints(evId,clsId,compId,cls){
  const comp=cls.competitors.find(c=>c.id===compId);
  if(comp&&comp.pointsCompetitor===false)return 0;
  const key=mpKey(evId,clsId,compId);
  if(state.manualPoints&&state.manualPoints[key]!==undefined)return state.manualPoints[key];
  return getCalcPoints(cls,compId);
}

function statusDotEl(s){const c=s==='active'?'#1db954':s==='completed'?'#3a8fd4':'#d4a000';return `<span style="width:7px;height:7px;border-radius:50%;background:${c};display:inline-block"></span>`;}
function statusBadge(s){return `<span class="status-badge s-${s}">${s}</span>`;}

function formatTime12(t){
  if(!t)return'';
  const[h,m]=t.split(':');let hr=parseInt(h);const ampm=hr>=12?'PM':'AM';hr=hr%12||12;return`${hr}:${m} ${ampm}`;
}
function formatEventDateTime(ev){
  const parts=[];
  if(ev.date)parts.push(ev.date);
  if(ev.time)parts.push('@ '+formatTime12(ev.time)+(ev.timezone?' '+ev.timezone:''));
  return parts.join(' ');
}
function formatEventLocation(ev){
  const parts=[];
  if(ev.location)parts.push(ev.location);
  const addr=[ev.address,ev.city,ev.state].filter(Boolean).join(', ');
  if(addr)parts.push(addr);
  return parts.join(' · ');
}

function getCountdown(ev){
  if(!ev.date)return null;
  const dateStr=ev.date+(ev.time?' '+ev.time:' 00:00');
  const target=new Date(dateStr);
  const diff=target-new Date();
  if(diff<=0)return null;
  return{d:Math.floor(diff/86400000),h:Math.floor((diff%86400000)/3600000),m:Math.floor((diff%3600000)/60000),s:Math.floor((diff%60000)/1000)};
}

function buildSeasonStats(){
  let totalPulls=0,totalEvents=0,totalDrivers=new Set(),totalFt=0;
  state.events.forEach(ev=>{
    let hasResults=false;
    ev.classes.forEach(cls=>{
      cls.competitors.forEach(c=>totalDrivers.add(c.driver));
      (cls.pulls||[]).forEach(p=>{if(p.result&&p.result!=='dq'&&p.result!=='broke'){totalPulls++;totalFt+=parseFloat(p.dist)||0;hasResults=true;}});
    });
    if(hasResults)totalEvents++;
  });
  return{totalPulls,totalEvents,totalDrivers:totalDrivers.size,totalFt:Math.round(totalFt)};
}

function renderFooter(){
  const c=state.contact||{};
  const hasContact=c.phone||c.email||c.website;
  const hasSocial=c.facebook||c.instagram||c.youtube;
  const hasAddr=c.mailingAddress;
  if(!hasContact&&!hasSocial&&!hasAddr)return;
  document.getElementById('siteFooter').style.display='block';
  if(hasContact){
    document.getElementById('footerContact').innerHTML=`
      <div class="footer-heading">Contact</div>
      ${c.phone?`<a href="tel:${c.phone}" class="footer-link">📞 ${c.phone}</a>`:''}
      ${c.email?`<a href="mailto:${c.email}" class="footer-link">✉ ${c.email}</a>`:''}
      ${c.website?`<a href="${c.website}" class="footer-link" target="_blank">🌐 ${c.website}</a>`:''}`;
  }
  if(hasSocial){
    document.getElementById('footerSocial').innerHTML=`
      <div class="footer-heading">Follow Us</div>
      ${c.facebook?`<a href="${c.facebook}" class="footer-link" target="_blank">Facebook</a>`:''}
      ${c.instagram?`<a href="${c.instagram}" class="footer-link" target="_blank">Instagram</a>`:''}
      ${c.youtube?`<a href="${c.youtube}" class="footer-link" target="_blank">YouTube</a>`:''}
      ${c.tiktok?`<a href="${c.tiktok}" class="footer-link" target="_blank">TikTok</a>`:''}`;
  }
  if(hasAddr){
    document.getElementById('footerAddress').innerHTML=`
      <div class="footer-heading">Mailing Address</div>
      <div style="font-size:14px;color:var(--text3);line-height:1.6">${c.mailingAddress.replace(/\n/g,'<br>')}</div>`;
  }
}

// HOME
function renderHome(){
  const el=document.getElementById('homeContent');
  const ev=getActiveEvent();
  const now=new Date();
  const upcoming=state.events.filter(e=>{if(!e.date)return false;return new Date(e.date+(e.time?' '+e.time:''))>now;}).sort((a,b)=>new Date(a.date)-new Date(b.date));
  const recent=[...state.events].filter(e=>e.date&&new Date(e.date)<=now).sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,3);
  const stats=buildSeasonStats();

  let html=`
  <div class="hero">
    <div class="hero-eyebrow">Welcome to</div>
    <div class="hero-title">CS PULLING <span>PROMOTIONS</span></div>
    <div class="hero-sub">Live Results &amp; Season Standings</div>
    ${ev?`<div style="display:inline-flex;align-items:center;gap:8px;background:rgba(192,57,43,.15);border:1px solid var(--red);border-radius:6px;padding:10px 18px;margin-top:4px">
      <span style="width:10px;height:10px;border-radius:50%;background:var(--green);display:inline-block;animation:pulse 2s infinite"></span>
      <span style="font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:700;letter-spacing:1px">${ev.name} — LIVE NOW</span>
    </div>`:''}
  </div>
  <div class="stats-bar">
    <div class="stat-cell"><div class="stat-val">${state.events.length}</div><div class="stat-lbl">Events</div></div>
    <div class="stat-cell"><div class="stat-val">${stats.totalDrivers}</div><div class="stat-lbl">Competitors</div></div>
    <div class="stat-cell"><div class="stat-val">${stats.totalPulls}</div><div class="stat-lbl">Total Pulls</div></div>
    <div class="stat-cell"><div class="stat-val">${stats.totalFt.toLocaleString()}</div><div class="stat-lbl">Feet Pulled</div></div>
    <div class="stat-cell"><div class="stat-val">${state.classes.length}</div><div class="stat-lbl">Classes</div></div>
  </div>
  <div style="padding:24px">`;

  // Countdown
  if(upcoming.length){
    const next=upcoming[0];
    const cd=getCountdown(next);
    if(cd){
      html+=`<div class="countdown-box">
        <div>
          <div style="font-size:11px;color:var(--text4);text-transform:uppercase;letter-spacing:2px;font-weight:700;margin-bottom:4px">Next Event</div>
          <div style="font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:900">${next.name}</div>
          <div style="font-size:14px;color:var(--text3);margin-top:2px">${formatEventDateTime(next)}</div>
          <div style="font-size:13px;color:var(--text4);margin-top:1px">${formatEventLocation(next)}</div>
        </div>
        <div style="display:flex;gap:16px">
          <div class="countdown-unit"><div class="countdown-num" id="cd-d">${cd.d}</div><div class="countdown-lbl">Days</div></div>
          <div class="countdown-unit"><div class="countdown-num" id="cd-h">${cd.h}</div><div class="countdown-lbl">Hrs</div></div>
          <div class="countdown-unit"><div class="countdown-num" id="cd-m">${cd.m}</div><div class="countdown-lbl">Min</div></div>
          <div class="countdown-unit"><div class="countdown-num" id="cd-s">${cd.s}</div><div class="countdown-lbl">Sec</div></div>
        </div>
      </div>`;
      clearInterval(window._cdInterval);
      window._cdInterval=setInterval(()=>{
        const c=getCountdown(next);if(!c)return;
        ['d','h','m','s'].forEach(k=>{const el=document.getElementById('cd-'+k);if(el)el.textContent=c[k];});
      },1000);
    }
  }

  // Upcoming scroller
  if(upcoming.length){
    const cards=upcoming.map(e=>`
      <div class="scroller-card">
        <div style="font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:800;margin-bottom:5px">${e.name}</div>
        <div style="font-size:13px;color:var(--text3)">${formatEventDateTime(e)}</div>
        <div style="font-size:12px;color:var(--text4);margin-top:3px">${formatEventLocation(e)}</div>
        <div style="font-size:11px;color:var(--text4);margin-top:5px">${e.classes?e.classes.length:0} classes</div>
      </div>`).join('');
    html+=`<div class="sec-line"><div class="sec">Upcoming Events</div></div>
      <div class="scroller-wrap"><div class="scroller-inner">${cards}${cards}</div></div>`;
  }

  // Live now card
  if(ev){
    const activeClass=ev.classes.find(c=>c.status==='active');
    const ranked=activeClass?getRankedPulls(activeClass):[];
    const leader=ranked[0];
    html+=`<div class="sec-line"><div class="sec">Live Now</div></div>
      <div class="card" style="border-left:3px solid var(--green);cursor:pointer;padding:18px" onclick="switchTab('results')">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:10px">
          <div style="flex:1">
            <div style="font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:900">${ev.name}</div>
            <div style="font-size:14px;color:var(--text3);margin-top:3px">${formatEventDateTime(ev)} · ${formatEventLocation(ev)}</div>
            ${activeClass?`<div style="margin-top:10px;padding:10px 14px;background:rgba(29,185,84,.07);border:1px solid rgba(29,185,84,.2);border-radius:6px">
              <div style="display:flex;align-items:center;gap:6px;margin-bottom:4px"><span style="width:8px;height:8px;border-radius:50%;background:var(--green);display:inline-block;animation:pulse 2s infinite"></span><span style="font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;color:var(--green)">${activeClass.name} — IN PROGRESS</span></div>
              ${leader&&leader.valid?`<div style="font-size:13px;color:var(--text2)">Leader: <strong style="color:var(--gold)">${leader.comp.driver}</strong> — <span style="color:var(--red);font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:700">${leader.pull.dist} ft</span></div>`:''}
            </div>`:'<div style="font-size:13px;color:var(--text4);margin-top:6px">No class currently active.</div>'}
          </div>
          <span style="font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;color:var(--red);letter-spacing:1px;align-self:center">VIEW →</span>
        </div>
      </div>`;
  }

  // Recent results
  if(recent.length){
    html+=`<div class="sec-line" style="margin-top:8px"><div class="sec">Recent Results</div></div>`;
    html+=recent.map(e=>{
      const winners=e.classes.map(cls=>{
        const ranked=getRankedPulls(cls);const w=ranked[0];
        return w&&w.valid?`<div style="display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--border)">
          <span style="font-size:13px;color:var(--text3);flex:1">${cls.name}</span>
          <span style="font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:14px;color:var(--gold)">${w.comp.driver}</span>
          <span style="font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:14px;color:var(--red);margin-left:12px">${w.pull.dist} ft</span>
        </div>`:null;
      }).filter(Boolean);
      return `<div class="card" style="margin-bottom:10px">
        <div style="font-family:'Barlow Condensed',sans-serif;font-size:19px;font-weight:800;margin-bottom:3px">${e.name}</div>
        <div style="font-size:13px;color:var(--text3);margin-bottom:10px">${formatEventDateTime(e)} · ${formatEventLocation(e)}</div>
        ${winners.length?winners.join(''):'<div style="font-size:13px;color:var(--text4)">No results recorded.</div>'}
      </div>`;
    }).join('');
  }

  if(!ev&&!upcoming.length&&!recent.length)html+=`<div style="text-align:center;padding:60px;color:var(--text4)"><div style="font-family:'Barlow Condensed',sans-serif;font-size:40px;font-weight:900;color:var(--border)">CS PULL LIVE</div><div style="font-size:15px;margin-top:10px">No events yet. Check back soon.</div></div>`;

  html+='</div>';
  el.innerHTML=html;
}

// LIVE RESULTS
function pullDisplay(p){
  if(!p||!p.result)return '<span style="color:var(--text4)">—</span>';
  if(p.result==='dq')return '<span class="result-tag tag-dq">DQ</span>';
  if(p.result==='broke')return '<span class="result-tag tag-broke">Broke</span>';
  const spd=p.speed?` <span style="font-size:12px;color:var(--text3)">${p.speed} mph</span>`:'';
  if(p.result==='full_pull')return `<span class="dist-val">${p.dist} ft</span> <span class="result-tag tag-full">Full Pull</span>${spd}`;
  return `<span class="dist-val">${p.dist} ft</span>${spd}`;
}
function renderViewer(){
  const ev=getActiveEvent();
  const bar=document.getElementById('viewerClassBar');
  const content=document.getElementById('viewerContent');
  if(!ev){
    bar.innerHTML='<span style="font-size:13px;color:var(--text4);font-family:\'Barlow Condensed\',sans-serif;letter-spacing:1px;text-transform:uppercase">No active event</span>';
    content.innerHTML='<div style="text-align:center;padding:60px;color:var(--text4)"><div style="font-family:\'Barlow Condensed\',sans-serif;font-size:40px;font-weight:900;color:var(--border)">NO ACTIVE EVENT</div></div>';
    return;
  }
  const ordered=[...ev.classes].sort((a,b)=>(a.classOrder||0)-(b.classOrder||0));
  bar.innerHTML=ordered.map(c=>`<span class="class-chip ${viewerActiveClass===c.id?'selected':''}" onclick="viewClass('${c.id}')">${statusDotEl(c.status)} ${c.name}</span>`).join('');
  if(!viewerActiveClass){
    content.innerHTML=`
      <div style="margin-bottom:18px">
        <div style="font-family:'Barlow Condensed',sans-serif;font-size:30px;font-weight:900;letter-spacing:1px">${ev.name}</div>
        <div style="font-size:14px;color:var(--text3);margin-top:3px">${formatEventDateTime(ev)} · ${formatEventLocation(ev)}</div>
      </div>
      <div class="card-dark">${ordered.map(c=>`
        <div style="display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--border)">
          <div style="font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:600">${c.name}</div>
          ${statusBadge(c.status)}
        </div>`).join('')}</div>`;
    return;
  }
  const cls=ev.classes.find(c=>c.id===viewerActiveClass);if(!cls)return;
  const ranked=getRankedPulls(cls);const leader=ranked[0];
  content.innerHTML=`
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:8px">
      <div>
        <div style="font-family:'Barlow Condensed',sans-serif;font-size:28px;font-weight:900;letter-spacing:1px">${cls.name}</div>
        <div style="font-size:13px;color:var(--text3)">${ev.name} · ${formatEventDateTime(ev)}</div>
      </div>
      ${statusBadge(cls.status)}
    </div>
    ${leader&&leader.valid?`
    <div class="leader-card">
      <div>
        <div class="leader-label">${cls.status==='completed'?'Class Winner':'Current Leader'}</div>
        <div class="leader-name">${leader.comp.driver}</div>
        <div class="leader-vehicle">${leader.comp.vehicle||''} ${leader.comp.vehicleName?'— '+leader.comp.vehicleName:''} ${leader.comp.home?'· '+leader.comp.home:''}</div>
        ${leader.pull.result==='full_pull'?'<div class="full-pull-badge">Full Pull</div>':''}
      </div>
      <div>
        <div class="leader-dist">${leader.pull.dist}</div>
        <div class="leader-dist-lbl">feet${leader.pull.speed?' · '+leader.pull.speed+' mph':''}</div>
      </div>
    </div>`:''}
    <div class="card-dark" style="padding:0;overflow:hidden"><div style="overflow-x:auto">
      <table class="results-table" style="min-width:500px">
        <thead><tr><th>Pos</th><th>Hook</th><th>Driver</th><th>Vehicle</th><th>Hometown</th><th>Result</th><th style="text-align:right">Pts</th></tr></thead>
        <tbody>${ranked.map((row,i)=>{
          const isDQ=row.pull&&(row.pull.result==='dq'||row.pull.result==='broke');
          const hasResult=row.pull&&row.pull.result;
          const isPoints=row.comp.pointsCompetitor!==false;
          const pts=hasResult&&!isDQ&&isPoints?getPoints(ev.id,cls.id,row.comp.id,cls):0;
          return `<tr class="${i===0&&row.valid?'top-row':''}">
            <td><span class="rank-badge ${!hasResult||isDQ?'rn':i===0?'r1':i===1?'r2':i===2?'r3':'rn'}">${!hasResult||isDQ?'—':i+1}</span></td>
            <td style="color:var(--text4);font-size:13px">${row.comp.hook||'—'}</td>
            <td><div style="font-family:'Barlow Condensed',sans-serif;font-size:17px;font-weight:${i<3&&row.valid?'700':'400'}">${row.comp.driver}</div><div style="font-size:11px;color:var(--text4)">${row.comp.vehicleName||''}${!isPoints?' <span style="color:#555;font-size:10px">Exhibition</span>':''}</div></td>
            <td style="color:var(--text3);font-size:13px">${row.comp.vehicle||''}</td>
            <td style="color:var(--text4);font-size:12px">${row.comp.home||''}</td>
            <td>${pullDisplay(row.pull)}</td>
            <td style="text-align:right;font-family:'Barlow Condensed',sans-serif;font-weight:700;color:var(--red);font-size:15px">${hasResult&&!isDQ&&isPoints?pts+' pts':'—'}</td>
          </tr>`;
        }).join('')}</tbody>
      </table>
    </div></div>`;
}
function viewClass(id){viewerActiveClass=id;renderViewer();}

// POINTS
function buildStandings(){
  const standings={};
  state.events.forEach(ev=>{
    ev.classes.forEach(cls=>{
      if(!cls.competitors||!cls.competitors.length)return;
      const pointsComps=cls.competitors.filter(c=>c.pointsCompetitor!==false);
      const ranked=getRankedPulls(cls).filter(r=>r.comp.pointsCompetitor!==false);
      ranked.forEach((row,idx)=>{
        const key=row.comp.driver.trim().toLowerCase();
        if(!standings[key])standings[key]={driver:row.comp.driver,vehicle:row.comp.vehicle||'',vehicleName:row.comp.vehicleName||'',classes:{}};
        if(!standings[key].classes[cls.name])standings[key].classes[cls.name]={totalPoints:0,events:[],wins:0,seconds:0,thirds:0,totalDist:0};
        const s=standings[key].classes[cls.name];
        const pts=getPoints(ev.id,cls.id,row.comp.id,cls);
        const pull=row.pull;
        s.totalPoints+=pts;
        s.events.push({evName:ev.name,evDate:ev.date,pts,dist:pull?parseFloat(pull.dist)||0:0});
        s.totalDist+=pull?parseFloat(pull.dist)||0:0;
        if(idx===0&&row.valid)s.wins++;if(idx===1&&row.valid)s.seconds++;if(idx===2&&row.valid)s.thirds++;
      });
    });
  });
  return standings;
}
function renderPoints(){
  const el=document.getElementById('pointsContent');
  const standings=buildStandings();
  const byClass={};
  Object.values(standings).forEach(driver=>{
    Object.keys(driver.classes).forEach(cls=>{
      if(!byClass[cls])byClass[cls]=[];
      byClass[cls].push({driver:driver.driver,vehicle:driver.vehicle,vehicleName:driver.vehicleName,...driver.classes[cls]});
    });
  });
  if(!Object.keys(byClass).length){el.innerHTML='<div style="text-align:center;padding:40px;color:var(--text4);font-family:\'Barlow Condensed\',sans-serif;font-size:18px;letter-spacing:1px">NO POINTS DATA YET</div>';return;}
  el.innerHTML=Object.keys(byClass).sort().map(cls=>{
    const drivers=byClass[cls].sort((a,b)=>b.totalPoints-a.totalPoints);
    return `<div class="card-dark" style="margin-bottom:18px">
      <div class="class-group-hdr">${cls}</div>
      <div style="overflow-x:auto"><table class="results-table" style="min-width:520px">
        <thead><tr><th>Pos</th><th>Driver</th><th>Vehicle</th><th style="text-align:right">Season Pts</th><th style="text-align:center">1st</th><th style="text-align:center">2nd</th><th style="text-align:center">3rd</th><th style="text-align:right">Events</th></tr></thead>
        <tbody>${drivers.map((d,i)=>`
          <tr class="${i===0?'top-row':''}">
            <td><span class="rank-badge ${i===0?'r1':i===1?'r2':i===2?'r3':'rn'}">${i+1}</span></td>
            <td><div style="font-weight:${i<3?'700':'400'};font-family:'Barlow Condensed',sans-serif;font-size:17px">${d.driver}</div><div style="font-size:11px;color:var(--text4)">${d.vehicleName||''}</div></td>
            <td style="color:var(--text3);font-size:13px">${d.vehicle||'—'}</td>
            <td style="text-align:right;font-family:'Barlow Condensed',sans-serif;font-size:19px;font-weight:900;color:var(--red)">${d.totalPoints}</td>
            <td style="text-align:center;color:var(--gold);font-weight:700;font-size:15px">${d.wins}</td>
            <td style="text-align:center;color:#a8a8a8;font-weight:700;font-size:15px">${d.seconds}</td>
            <td style="text-align:center;color:#a0522d;font-weight:700;font-size:15px">${d.thirds}</td>
            <td style="text-align:center;color:var(--text4);font-size:14px">${d.events.length}</td>
          </tr>
          <tr><td colspan="8" style="padding:0 12px 10px 40px;border-bottom:2px solid var(--border2)">
            <div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:5px">
              ${d.events.map(e=>`<span style="background:var(--bg4);border:1px solid var(--border2);border-radius:4px;padding:4px 10px;font-size:12px;color:var(--text3)">${e.evName}${e.evDate?' ('+e.evDate+')':''}: <strong style="color:var(--red)">${e.pts} pts</strong>${e.dist?' · '+e.dist.toFixed(1)+' ft':''}</span>`).join('')}
            </div>
          </td></tr>`).join('')}
        </tbody>
      </table></div></div>`;
  }).join('');
}

// SCHEDULE
function renderSchedule(){
  const el=document.getElementById('scheduleContent');
  const sorted=[...state.events].sort((a,b)=>new Date(a.date||0)-new Date(b.date||0));
  if(!sorted.length){el.innerHTML='<div style="text-align:center;padding:40px;color:var(--text4)">No events scheduled.</div>';return;}
  const now=new Date();
  el.innerHTML=sorted.map(ev=>{
    const isPast=ev.date&&new Date(ev.date)<now;
    return `<div class="event-card ${ev.id===state.activeEventId?'active-event':''}" onclick="showEventDetail('${ev.id}')">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:8px">
        <div>
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:5px;flex-wrap:wrap">
            ${ev.id===state.activeEventId?`<span style="background:var(--green);color:#fff;font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;padding:3px 8px;border-radius:3px;letter-spacing:1px">ACTIVE</span>`:''}
            ${isPast?`<span style="background:var(--bg4);color:var(--text4);font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;padding:3px 8px;border-radius:3px;letter-spacing:1px">PAST</span>`:''}
          </div>
          <div style="font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:800">${ev.name}</div>
          <div style="font-size:14px;color:var(--text3);margin-top:3px">${formatEventDateTime(ev)}</div>
          <div style="font-size:13px;color:var(--text4);margin-top:2px">${formatEventLocation(ev)}</div>
        </div>
        <div style="font-size:13px;color:var(--text4)">${ev.classes?ev.classes.length:0} classes ›</div>
      </div>
    </div>`;
  }).join('');
  if(selectedScheduleEvent)showEventDetail(selectedScheduleEvent);
}
function showEventDetail(evId){
  selectedScheduleEvent=evId;
  const ev=state.events.find(e=>e.id===evId);
  const panel=document.getElementById('eventDetailPanel');
  if(!ev){panel.style.display='none';return;}
  panel.style.display='block';
  const ordered=[...ev.classes].sort((a,b)=>(a.classOrder||0)-(b.classOrder||0));
  panel.innerHTML=`
    <div class="card" style="border-top:3px solid var(--red)">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px">
        <div>
          <div style="font-family:'Barlow Condensed',sans-serif;font-size:24px;font-weight:900">${ev.name}</div>
          <div style="font-size:14px;color:var(--text3);margin-top:3px">${formatEventDateTime(ev)}</div>
          <div style="font-size:13px;color:var(--text4);margin-top:2px">${[ev.address,ev.city,ev.state].filter(Boolean).join(', ')}</div>
          ${ev.location?`<div style="font-size:13px;color:var(--text4)">${ev.location}</div>`:''}
          ${ev.notes?`<div style="font-size:13px;color:var(--text3);margin-top:8px;background:var(--bg4);padding:10px 12px;border-radius:5px;line-height:1.5">${ev.notes}</div>`:''}
        </div>
        <button onclick="document.getElementById('eventDetailPanel').style.display='none';selectedScheduleEvent=null" style="background:none;border:none;color:var(--text4);cursor:pointer;font-size:22px;padding:4px">×</button>
      </div>
      <div class="sec-line"><div class="sec">Class Order</div></div>
      ${ordered.map((c,i)=>`
        <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border)">
          <div style="display:flex;align-items:center;gap:12px">
            <span style="font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:700;color:var(--text4);min-width:24px">${i+1}</span>
            <div>
              <div style="font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:600">${c.name}</div>
              <div style="font-size:12px;color:var(--text4)">${c.competitors.length} registered</div>
            </div>
          </div>
          ${statusBadge(c.status)}
        </div>`).join('')}
    </div>`;
  panel.scrollIntoView({behavior:'smooth',block:'start'});
}

db.ref('cspull').on('value',snap=>{
  const data=snap.val();
  if(data){
    state.events=data.events?Object.values(data.events).map(ev=>({...ev,classes:ev.classes?Object.values(ev.classes).map(cls=>({...cls,competitors:cls.competitors?Object.values(cls.competitors):[],pulls:cls.pulls?Object.values(cls.pulls):[]})):[]})):[];
    state.members=data.members?Object.values(data.members):[];
    state.classes=data.classes?Object.values(data.classes):[];
    state.activeEventId=data.activeEventId||null;
    state.manualPoints=data.manualPoints||{};
    state.contact=data.contact||{};
  }
  const ev=getActiveEvent();
  document.getElementById('headerEvent').textContent=ev?ev.name:'No Active Event';
  renderFooter();
  const active=['home','results','points','schedule'].find(t=>document.getElementById('tab-'+t).classList.contains('active'));
  if(active==='home')renderHome();
  else if(active==='results')renderViewer();
  else if(active==='points')renderPoints();
  else if(active==='schedule')renderSchedule();
  document.getElementById('statusDot').className='dot';
  document.getElementById('statusText').textContent='LIVE';
});
db.ref('.info/connected').on('value',snap=>{
  if(!snap.val()){document.getElementById('statusDot').className='dot offline';document.getElementById('statusText').textContent='OFFLINE';}
});
